[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-automation-mcp"
version = "0.2.0"
description = "Deny-by-default, per-action-gated Windows window MCP server"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # The lower bounds are versions locally verified (mcp 2.3.0 on 2026-10-18,
    # Pillow 12.3.0 on 2026-09-15); prevents a silent fallback to an
    # older/vulnerable version. The server uses the MCP 2.x `MCPServer` API;
    # the next major version may change it, so the range stops before 3.
    "mcp>=2.3,<3",
    "Pillow>=12.3",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.16,<8",
    "ruff>=0.15.5,<0.18",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Pin the existing default-rule contract explicitly. Ruff 0.16 enables a
# broader rule surface; adopting those rules is separate maintenance work,
# not an implicit consequence of updating the formatter/linter binary.
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
branch = true
source = ["src/desktop_automation_mcp"]

[tool.coverage.report]
# Floor just under the branch coverage measured on 2026-09-25: 86.92% on
# Python 3.12, 3.13 and 3.14 alike (371 tests). Raise it as coverage rises;
# a pull request that lowers it should say why.
fail_under = 86
show_missing = true
skip_covered = true

[project.scripts]
desktop-automation-mcp = "desktop_automation_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
