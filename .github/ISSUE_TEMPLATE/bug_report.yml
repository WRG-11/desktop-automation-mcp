name: Bug report
description: Report a reproducible non-security defect.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include a real policy file, window title, executable path,
        screenshot, audit event, confirmation token, or other private data.
        Report security boundary bypasses through SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Project version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows, Python, and MCP client
      placeholder: Windows 11; Python 3.12; Claude Desktop
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal redacted reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
