version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The server uses the MCP 2.x MCPServer API and its ToolError rule. A
      # major upgrade needs an explicit compatibility migration, not an
      # automated manifest edit.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
