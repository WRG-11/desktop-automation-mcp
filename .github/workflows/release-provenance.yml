name: Release provenance

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and attest
        required: true
        type: string

# A tag builds attestable artifacts; it cannot publish a package or edit a release.
permissions: {}

jobs:
  build-and-attest:
    name: Build and attest release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Verify tag, package version, and changelog agree
        run: python tools/verify_release_metadata.py ${{ inputs.tag || github.ref_name }}
      - name: Build source and wheel distributions
        run: python -m build
      - name: Generate build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Retain release distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: desktop-automation-mcp-${{ inputs.tag || github.ref_name }}
          path: dist/*
          if-no-files-found: error
