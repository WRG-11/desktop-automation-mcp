name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

# The workflow only needs to read this repository.
permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on Windows
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" build
      - name: Lint
        run: python -m ruff check src tests
      - name: Verify formatting
        run: python -m ruff format --check src tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Build wheel
        run: python -m build --wheel
      - name: Verify installed wheel outside the checkout
        shell: pwsh
        run: |
          python -m pip install --force-reinstall dist/*.whl
          Push-Location $env:RUNNER_TEMP
          python -c "import desktop_automation_mcp; print(desktop_automation_mcp.__version__)"
          (Get-Command desktop-automation-mcp -ErrorAction Stop).Source
          Pop-Location
