name: Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# The workflow only needs to read this repository.
permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on Windows
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" build
      - name: Lint
        run: python -m ruff check src tests
      - name: Verify formatting
        run: python -m ruff format --check src tests
      # Two steps, not one multi-line step: the Windows default shell only
      # reports the exit code of a step's last command.
      - name: Run unit tests under branch coverage
        run: python -m coverage run -m unittest discover -s tests -v
      - name: Enforce the coverage floor
        run: python -m coverage report
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Verify source integrity manifest
        run: python tools/compute_integrity_hash.py check
      - name: Build wheel
        run: python -m build --wheel
      - name: Verify installed wheel outside the checkout
        shell: pwsh
        run: |
          $wheels = @(Get-ChildItem -Path dist -Filter *.whl -File)
          if ($wheels.Count -ne 1) { throw "Expected exactly one wheel, found $($wheels.Count)." }
          python -m pip install --force-reinstall $wheels[0].FullName
          Push-Location $env:RUNNER_TEMP
          python -c "import desktop_automation_mcp; print(desktop_automation_mcp.__version__)"
          (Get-Command desktop-automation-mcp -ErrorAction Stop).Source
          python $env:GITHUB_WORKSPACE/tools/verify_stdio_handshake.py
          Pop-Location
